<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="ReadNook，本地优先、安静专注的小说阅读器。" />
    <meta name="theme-color" content="#f6efe3" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      不要加 apple-mobile-web-app-status-bar-style：iOS 26 起 black-translucent
      已被废弃（Home Screen web app 不再允许内容画到状态栏下面，只会糊上一层暗色蒙层），
      Apple 的建议是删掉这个 key，让状态栏自动取页面背景色。
    -->
    <meta name="apple-mobile-web-app-title" content="ReadNook" />
    <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%icons/apple-touch-icon-180.png"
    />
    <title>ReadNook</title>
    <script>
      ;(() => {
        const THEME_COLORS = {
          paper: '#f6efe3',
          sepia: '#eaf0e2',
          dark: '#171916',
        }
        try {
          const theme = localStorage.getItem('readnook.theme')
          if (theme !== 'paper' && theme !== 'sepia' && theme !== 'dark') return
          const root = document.documentElement
          root.dataset.theme = theme
          // 首帧就把浏览器/系统 UI 的颜色定对，避免先亮后暗闪一下。
          root.style.colorScheme = theme === 'dark' ? 'dark' : 'light'
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', THEME_COLORS[theme])
        } catch {
          // 主题镜像不可用时使用默认主题，不影响阅读数据。
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif">
        ReadNook 需要启用 JavaScript 才能导入和阅读本地小说。
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
